[package]
name = "snip-it"
version = "1.3.5"
edition = "2024"
rust-version = "1.94"
description = "Fast terminal snippet manager with fuzzy search, TUI, variable expansion, and end-to-end encrypted cross-device sync"
license = "MIT"
homepage = "https://github.com/eggstack/snip-it"
documentation = "https://docs.rs/snip-it"
readme = "README.md"
keywords = ["cli", "snippets", "terminal", "tui", "productivity"]
categories = ["command-line-utilities", "development-tools", "filesystem"]
authors = ["David Bowman <dbowman91@proton.me>"]
repository = "https://github.com/eggstack/snip-it"
exclude = [
    ".github/",
    "architecture/",
    ".skills/",
    ".opencode/",
    "plans/",
    "plan.md",
    "AGENTS.md",
    "AGENTS.override.md",
    "USER_GUIDE.md",
    "snippets.example.toml",
    "deny.toml",
    "snip-sync/",
    "tests/",
    "themes/",
    "rustfmt.toml",
    "rust-toolchain.toml",
    ".gitignore",
    "snip-proto/",
    "assets/",
    "scripts/",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "CODE_OF_CONDUCT.md",
    "CHANGELOG.md",
    "snip-it-demo.gif",
    "snip-it-demo.mp4",
    "snip-it-demo.tape",
]

[[bin]]
name = "snp"
path = "src/main.rs"

# Cross-process lock test helper binary. Only enabled under `test-support`
# so production builds do not include this code path.
[[bin]]
name = "process_lock_helper"
path = "tests/bin/process_lock_helper.rs"
required-features = ["test-support"]

# The repair_transactions integration test exercises the public transaction
# recovery API, which is only re-exported under the `test-support` feature.
# Gate the target so that `cargo test --workspace --all-targets` (without
# `--all-features`) can compile cleanly.
[[test]]
name = "repair_transactions"
path = "tests/repair_transactions.rs"
required-features = ["test-support"]

[[test]]
name = "process_lock_concurrency"
path = "tests/process_lock_concurrency.rs"
required-features = ["test-support"]

[package.metadata.docs.rs]
all-features = false
default-target = "x86_64-unknown-linux-gnu"
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_System_IO", "Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(not(windows))'.dependencies]
arboard = { version = "3", default-features = false }
signal-hook = "0.4"
libc = "0.2"

[dependencies]
dirs = "6.0"
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help"] }
clap_complete = "4.5"
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = "1.0"
semver = "1"
toml = "1.1"
ratatui = "0.30"
crossterm = "0.29"
fuzzy-matcher = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "env-filter"] }
tracing-appender = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4"] }
tonic = { version = "0.14", default-features = false, features = ["codegen", "channel", "tls-ring"] }
prost = "0.14"
snip-proto = { version = "0.1.2", path = "snip-proto" }
aes-gcm = "0.11"
argon2 = "0.5"
base64 = "0.23"

regex = "1.11"
zeroize = { version = "1", features = ["derive"] }
keyring = "4"
crc32fast = "1.4"
sha2 = "0.11"
time = ">=0.3.36, <0.4"
unicode-width = "0.2"
shell-words = "1.1"
tempfile = "3.10"
flate2 = "1"

[dev-dependencies]
tempfile = "3.10"
subtle = "2"
snip-sync = { version = "0.1.3", path = "snip-sync", features = ["test-helpers"] }
portable-pty = "0.9"
libc = "0.2"
crc32fast = "1.4"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"] }
keyring = "4"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"

[workspace]
members = ["snip-proto", "snip-sync"]
resolver = "2"

[features]
test-support = []

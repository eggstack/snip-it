name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PROTOC_VERSION: "25.1"

jobs:
  linux-correctness:
    name: Linux correctness
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          components: rustfmt, clippy
      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh
        env:
          PROTOC_VERSION: ${{ env.PROTOC_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --workspace --all-features
      - name: Test
        run: cargo test --workspace --all-features -- --test-threads=1

  platform-smoke:
    name: Platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
      - name: Install protoc (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/ci/install-protoc.sh
        env:
          PROTOC_VERSION: ${{ env.PROTOC_VERSION }}
      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -File scripts/ci/install-protoc.ps1 -Version ${{ env.PROTOC_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features
      - name: Library tests
        run: cargo test --workspace --all-features --lib -- --test-threads=1
      - name: CLI/platform smoke
        run: cargo test --test platform_smoke --features test-support -- --test-threads=1

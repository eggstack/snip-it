---
name: Link Check

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # Mondays at 06:00 UTC

permissions:
  contents: read

jobs:
  markdown-links:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check links in README and the user guide
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --exclude-loopback
            --exclude-link-local
            --exclude 'https://github.com/eggstack/snip-it/(issues|actions|releases).*'
            --exclude 'https://crates.io/.*'
            README.md
            docs/USER_GUIDE.md
            SECURITY.md
            CONTRIBUTING.md
            CODE_OF_CONDUCT.md
            snip-sync/README.md
          fail: true
